<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><title>Less — a quieter phone</title><rect width="1200" height="640" fill="#e9e8e3"/><text x="81" y="306" fill="#272725" font-family="Georgia,serif" font-size="146">less.</text><text x="89" y="370" fill="#72716b" font-family="Arial,sans-serif" font-size="30">Room for everything else.</text><g transform="translate(745 42) rotate(7 143 278)"><rect x="7" y="8" width="286" height="552" rx="46" fill="#c3c2bb"/><rect width="286" height="552" rx="46" fill="#242424"/><rect x="8" y="8" width="270" height="536" rx="39" fill="#171717" stroke="#4b4b48" stroke-width="2"/><rect x="102" y="19" width="82" height="21" rx="11" fill="#080808"/><text x="30" y="112" fill="#f0f0e9" font-family="Arial,sans-serif" font-size="45" font-weight="300">9:41</text><text x="32" y="145" fill="#898985" font-family="Arial,sans-serif" font-size="16">a little more present</text><g fill="#e7e7de" font-family="Arial,sans-serif" font-size="28"><text x="32" y="229">Phone</text><text x="32" y="282">Messages</text><text x="32" y="335">Maps</text><text x="32" y="388">Camera</text><text x="32" y="441">Notes</text></g><rect x="95" y="527" width="96" height="4" rx="2" fill="#777771"/></g></svg>
