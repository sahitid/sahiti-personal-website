<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7a5a"/>
      <stop offset="1" stop-color="#065a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b2b21" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="70" y="60" width="760" height="1480" rx="120" fill="#0b1512" filter="url(#shadow)"/>
  <rect x="105" y="110" width="690" height="1380" rx="92" fill="url(#bg)"/>

  <!-- Top notch -->
  <rect x="330" y="130" width="240" height="40" rx="20" fill="#0b1512" opacity="0.12"/>

  <!-- Header -->
  <rect x="135" y="210" width="630" height="120" rx="36" fill="#ffffff"/>
  <text x="175" y="285" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="42" font-weight="700" fill="#0d1f18">Deals near you</text>
  <circle cx="720" cy="270" r="22" fill="url(#brand)" opacity="0.16"/>
  <circle cx="720" cy="270" r="12" fill="url(#brand)"/>

  <!-- Deal cards -->
  <g transform="translate(135,370)">
    <rect width="630" height="200" rx="40" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <rect x="32" y="36" width="92" height="92" rx="26" fill="#e6f2ee"/>
    <path d="M78 62c18 0 34 16 34 34s-16 34-34 34-34-16-34-34 16-34 34-34z" fill="#0a7a5a" opacity="0.14"/>
    <text x="148" y="84" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="700" fill="#0d1f18">15% off brunch</text>
    <text x="148" y="130" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="600" fill="#527166">Today · In-store QR</text>
    <rect x="148" y="154" width="190" height="34" rx="17" fill="#e6f2ee"/>
    <text x="170" y="178" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="700" fill="#0a7a5a">Verified</text>
    <rect x="500" y="150" width="98" height="38" rx="19" fill="#f3f6f5" stroke="#d9e4df" stroke-width="4"/>
    <text x="520" y="176" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700" fill="#0d1f18">2 mi</text>
  </g>

  <g transform="translate(135,600)">
    <rect width="630" height="200" rx="40" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <rect x="32" y="36" width="92" height="92" rx="26" fill="#e6f2ee"/>
    <text x="148" y="84" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="700" fill="#0d1f18">Free dessert</text>
    <text x="148" y="130" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="600" fill="#527166">This week · Scan to redeem</text>
    <rect x="148" y="154" width="230" height="34" rx="17" fill="#f3f6f5" stroke="#d9e4df" stroke-width="4"/>
    <text x="170" y="178" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="700" fill="#527166">Story checklist</text>
    <rect x="500" y="150" width="98" height="38" rx="19" fill="#f3f6f5" stroke="#d9e4df" stroke-width="4"/>
    <text x="520" y="176" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700" fill="#0d1f18">4 mi</text>
  </g>

  <g transform="translate(135,830)">
    <rect width="630" height="200" rx="40" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <rect x="32" y="36" width="92" height="92" rx="26" fill="#e6f2ee"/>
    <text x="148" y="84" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="700" fill="#0d1f18">$10 off dinner</text>
    <text x="148" y="130" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="600" fill="#527166">Tonight · Verified QR</text>
    <rect x="148" y="154" width="170" height="34" rx="17" fill="#e6f2ee"/>
    <text x="170" y="178" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="700" fill="#0a7a5a">New</text>
  </g>

  <!-- Bottom nav -->
  <rect x="135" y="1320" width="630" height="130" rx="46" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
  <circle cx="250" cy="1385" r="16" fill="#0a7a5a"/>
  <circle cx="450" cy="1385" r="16" fill="#9ab4ab"/>
  <circle cx="650" cy="1385" r="16" fill="#9ab4ab"/>
</svg>
