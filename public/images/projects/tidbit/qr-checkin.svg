  <text x="175" y="320" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="600" fill="#527166">Scan in-store to redeem</text>

  <rect x="135" y="370" width="630" height="680" rx="48" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
  <rect x="190" y="430" width="520" height="520" rx="36" fill="#f3f6f5" stroke="#d9e4df" stroke-width="6"/>

  <!-- Simple ·QR-like· blocks -->
  <g fill="#0d1f18" opacity="0.9">
    <rect x="220" y="460" width="90" height="90" rx="14"/>
    <rect x="590" y="460" width="90" height="90" rx="14"/>
    <rect x="220" y="830" width="90" height="90" rx="14"/>

    <rect x="340" y="460" width="40" height="40" rx="10"/>
    <rect x="410" y="460" width="40" height="40" rx="10"/>
    <rect x="480" y="460" width="40" height="40" rx="10"/>
    <rect x="340" y="530" width="40" height="40" rx="10"/>
    <rect x="410" y="600" width="40" height="40" rx="10"/>
    <rect x="480" y="530" width="40" height="40" rx="10"/>
    <rect x="550" y="600" width="40" height="40" rx="10"/>
    <rect x="340" y="670" width="40" height="40" rx="10"/>
    <rect x="410" y="740" width="40" height="40" rx="10"/>
    <rect x="480" y="670" width="40" height="40" rx="10"/>
    <rect x="550" y="740" width="40" height="40" rx="10"/>
    <rect x="620" y="670" width="40" height="40" rx="10"/>
    <rect x="340" y="810" width="40" height="40" rx="10"/>
    <rect x="410" y="880" width="40" height="40" rx="10"/>
    <rect x="480" y="810" width="40" height="40" rx="10"/>
    <rect x="550" y="880" width="40" height="40" rx="10"/>
  </g>

  <rect x="135" y="1090" width="630" height="160" rx="46" fill="#0a7a5a"/>
  <text x="450" y="1184" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="800" fill="#ffffff">Confirm redemption</text>
</svg>
