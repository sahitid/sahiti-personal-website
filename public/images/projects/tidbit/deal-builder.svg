<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b2b21" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="70" y="60" width="760" height="1480" rx="120" fill="#0b1512" filter="url(#shadow)"/>
  <rect x="105" y="110" width="690" height="1380" rx="92" fill="url(#bg)"/>

  <rect x="135" y="210" width="630" height="120" rx="36" fill="#ffffff"/>
  <text x="175" y="285" font-family="ui-sans-serif, system-ui" font-size="42" font-weight="800" fill="#0d1f18">New deal</text>

  <!-- Form fields -->
  <g transform="translate(135,370)">
    <rect width="630" height="128" rx="34" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="40" y="58" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800" fill="#527166">TITLE</text>
    <text x="40" y="98" font-family="ui-sans-serif, system-ui" font-size="30" font-weight="800" fill="#0d1f18">15% off brunch</text>
  </g>

  <g transform="translate(135,520)">
    <rect width="630" height="180" rx="34" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="40" y="58" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800" fill="#527166">DESCRIPTION</text>
    <text x="40" y="104" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="700" fill="#0d1f18">In-store only. Show this</text>
    <text x="40" y="138" font-family="ui-sans-serif, system-ui" font-size="26" font-weight="700" fill="#0d1f18">deal + scan QR to redeem.</text>
  </g>

  <g transform="translate(135,730)">
    <text x="0" y="30" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800" fill="#527166">CATEGORY</text>
    <rect x="0" y="52" width="220" height="56" rx="28" fill="#e6f2ee" stroke="#0a7a5a" stroke-width="6"/>
    <text x="110" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="900" fill="#0a7a5a">Brunch</text>
    <rect x="240" y="52" width="220" height="56" rx="28" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="350" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="900" fill="#527166">Dessert</text>
    <rect x="480" y="52" width="150" height="56" rx="28" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="555" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="900" fill="#527166">Happy</text>
  </g>

  <g transform="translate(135,880)">
    <rect width="308" height="132" rx="34" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="36" y="54" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800" fill="#527166">QTY</text>
    <text x="154" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="36" font-weight="900" fill="#0d1f18">30</text>

    <rect x="322" width="308" height="132" rx="34" fill="#ffffff" stroke="#d9e4df" stroke-width="6"/>
    <text x="358" y="54" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="800" fill="#527166">EXPIRY</text>
    <text x="476" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="900" fill="#0d1f18">Apr 30</text>
  </g>

  <rect x="135" y="1320" width="630" height="130" rx="46" fill="#0a7a5a"/>
  <text x="450" y="1404" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="900" fill="#ffffff">Create deal</text>
</svg>
